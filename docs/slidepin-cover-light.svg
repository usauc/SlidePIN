<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#F7FAFE"/>
      <stop offset="1" stop-color="#EEF4FB"/>
    </linearGradient>
    <radialGradient id="haloL" cx="0.2" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#C9F2EA" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C9F2EA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="keyL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F8FD"/>
    </linearGradient>
    <linearGradient id="accentL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17C7B0"/>
      <stop offset="1" stop-color="#0FA5D8"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#2A4A72" flood-opacity="0.13"/>
    </filter>
    <filter id="keyShadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#33507A" flood-opacity="0.10"/>
    </filter>
    <filter id="glowL" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="gridL" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1" fill="#C9D6E8" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bgL)"/>
  <rect width="1280" height="640" fill="url(#gridL)" opacity="0.45"/>
  <rect width="1280" height="640" fill="url(#haloL)"/>

  <!-- 左侧文字 -->
  <g font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif">
    <text x="88" y="236" fill="#101D31" font-size="104" font-weight="700" letter-spacing="-2">SlidePIN</text>
    <text x="90" y="298" fill="#41536E" font-size="27">给锁屏数字密码加上滑动输入</text>
    <text x="90" y="340" fill="#7B8CA6" font-size="21">手指依次划过各位数字，一笔完成输入</text>

    <g>
      <rect x="90" y="390" width="152" height="38" rx="19" fill="#FFFFFF" stroke="#D8E4F2"/>
      <text x="166" y="415" fill="#0E9E8B" font-size="17" text-anchor="middle">LSPosed 模块</text>

      <rect x="256" y="390" width="128" height="38" rx="19" fill="#FFFFFF" stroke="#D8E4F2"/>
      <text x="320" y="415" fill="#3C6FB5" font-size="17" text-anchor="middle">Android 13</text>

      <rect x="398" y="390" width="118" height="38" rx="19" fill="#FFFFFF" stroke="#D8E4F2"/>
      <text x="457" y="415" fill="#6B7C95" font-size="17" text-anchor="middle">MIT 协议</text>
    </g>

    <text x="90" y="556" fill="#93A3BA" font-size="17">github.com/usauc/SlidePIN</text>
  </g>

  <!-- 右侧面板 -->
  <g>
    <rect x="716" y="58" width="472" height="540" rx="40" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="716" y="58" width="472" height="540" rx="40" fill="none" stroke="#E4EDF8"/>

    <!-- 圆点 -->
    <g fill="#12B5A2">
      <circle cx="884" cy="122" r="7"/>
      <circle cx="912" cy="122" r="7"/>
      <circle cx="940" cy="122" r="7"/>
      <circle cx="968" cy="122" r="7"/>
    </g>
    <text x="952" y="158" fill="#9AA9BF" font-size="15" text-anchor="middle"
          font-family="Segoe UI, Microsoft YaHei, sans-serif">请输入密码</text>

    <!-- 键盘 -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" text-anchor="middle">
      <!-- 行1 -->
      <rect x="790" y="186" width="84" height="84" rx="26" fill="url(#keyL)" stroke="#E2EBF6" filter="url(#keyShadow)"/>
      <text x="832" y="242" fill="#22334C">1</text>
      <rect x="892" y="186" width="84" height="84" rx="26" fill="url(#keyL)" stroke="#9FE6DA" stroke-width="1.6" filter="url(#keyShadow)"/>
      <text x="934" y="242" fill="#0C7F71">2</text>
      <rect x="994" y="186" width="84" height="84" rx="26" fill="url(#keyL)" stroke="#E2EBF6" filter="url(#keyShadow)"/>
      <text x="1036" y="242" fill="#22334C">3</text>

      <!-- 行2 -->
      <rect x="790" y="292" width="84" height="84" rx="26" fill="url(#keyL)" stroke="#E2EBF6" filter="url(#keyShadow)"/>
      <text x="832" y="348" fill="#22334C">4</text>
      <rect x="892" y="292" width="84" height="84" rx="26" fill="url(#keyL)" stroke="#9FE6DA" stroke-width="1.6" filter="url(#keyShadow)"/>
      <text x="934" y="348" fill="#0C7F71">5</text>
      <rect x="994" y="292" width="84" height="84" rx="26" fill="url(#keyL)" stroke="#E2EBF6" filter="url(#keyShadow)"/>
      <text x="1036" y="348" fill="#22334C">6</text>

      <!-- 行3 -->
      <rect x="790" y="398" width="84" height="84" rx="26" fill="url(#keyL)" stroke="#E2EBF6" filter="url(#keyShadow)"/>
      <text x="832" y="454" fill="#22334C">7</text>
      <rect x="892" y="398" width="84" height="84" rx="26" fill="url(#keyL)" stroke="#9FE6DA" stroke-width="1.6" filter="url(#keyShadow)"/>
      <text x="934" y="454" fill="#0C7F71">8</text>
      <rect x="994" y="398" width="84" height="84" rx="26" fill="url(#keyL)" stroke="#E2EBF6" filter="url(#keyShadow)"/>
      <text x="1036" y="454" fill="#22334C">9</text>

      <!-- 行4 -->
      <rect x="892" y="504" width="84" height="84" rx="26" fill="url(#keyL)" stroke="#9FE6DA" stroke-width="1.6" filter="url(#keyShadow)"/>
      <text x="934" y="560" fill="#0C7F71">0</text>

      <g stroke="#8FA0B8" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round">
        <path d="M1030 542 h26 l14 -14 l-14 -14 h-26 l-14 14 z"/>
        <path d="M1038 538 l12 -12 M1038 526 l12 12"/>
      </g>
    </g>

    <!-- 滑动轨迹：缝隙中的渐变连接段 -->
    <g stroke-linecap="round" fill="none">
      <g stroke="#34CFBB" stroke-width="13" opacity="0.18" filter="url(#glowL)">
        <path d="M934 272 L934 290"/>
        <path d="M934 378 L934 396"/>
        <path d="M934 484 L934 502"/>
      </g>
      <g stroke="#12B5A2" stroke-width="6">
        <path d="M934 272 L934 290"/>
        <path d="M934 378 L934 396"/>
        <path d="M934 484 L934 502"/>
      </g>
    </g>
  </g>
</svg>
